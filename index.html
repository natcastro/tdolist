<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist académico</title>
<style>
  :root{
    --bg: #F5F6F2;
    --card: #FFFFFF;
    --ink: #182226;
    --ink-soft: #5B6B70;
    --line: #E2E3DC;
    --line-strong: #CBCDC3;
    --accent: #0F6B5C;
    --accent-soft: #E1F0EB;
    --overdue: #B4402F;
    --overdue-soft: #FBE9E5;
    --soon: #B3781A;
    --soon-soft: #FBF0DD;
    --done: #8C9192;

    --c-hrm540: #B3781A;
    --c-hrm540-soft: #FBF0DD;
    --c-is531: #2E6C8E;
    --c-is531-soft: #E4EEF3;
    --c-is550: #3F7D5C;
    --c-is550-soft: #E6F1EA;
    --c-is551: #A44B63;
    --c-is551-soft: #F5E6EA;
    --c-is560: #A6482F;
    --c-is560-soft: #F5E5DF;
    --c-is590r: #1F7A6C;
    --c-is590r-soft: #E1F1EC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 32px 24px 80px;
  }
  h1,h2,h3{
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-weight: 600;
    margin: 0;
  }
  .wrap{ max-width: 1080px; margin: 0 auto; }
  header{ margin-bottom: 28px; }
  header h1{ font-size: 28px; letter-spacing: -0.01em; }
  header p{ color: var(--ink-soft); margin: 6px 0 0; font-size: 14px; }

  .kpi-row{
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
    margin-bottom: 28px;
  }
  .kpi{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 12px;
    min-height: 86px;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
  }
  .kpi.main{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .kpi .num{ font-size: 22px; font-weight: 600; font-family: Georgia, serif; }
  .kpi .lbl{ font-size: 11.5px; color: var(--ink-soft); line-height: 1.3; }
  .kpi.main .lbl{ color: rgba(255,255,255,0.82); }
  .kpi.goal{
    border-color: var(--line);
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
  }
  .kpi.goal:hover{ border-color: var(--line-strong); background: #FBFBF8; }
  .kpi.goal .top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .kpi.goal .icon{ font-size: 16px; }
  .kpi.goal .count{ font-size: 12px; font-weight: 600; color: var(--ink); }
  .kpi.goal .lbl{ font-size: 11px; line-height: 1.25; margin-top: 6px; }

  .modal-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(24,34,38,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background: var(--card);
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 380px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal .modal-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
  .modal .modal-title{ font-size: 17px; display:flex; align-items:center; gap:8px; }
  .modal .modal-close{ background:none; border:none; font-size:18px; color: var(--ink-soft); cursor:pointer; }
  .modal .modal-target{ font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 4px; }
  .modal .modal-note{ font-size: 12px; color: var(--ink-soft); margin-bottom: 16px; line-height:1.4; }
  .modal .cal-nav{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
  .modal .cal-nav button{ background:none; border:1px solid var(--line-strong); border-radius:6px; cursor:pointer; padding:3px 9px; font-size:13px; color: var(--ink-soft); }
  .modal .cal-nav .cal-month{ font-size: 13px; font-weight: 600; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:5px; }
  .cal-dow{ font-size: 10px; color: var(--ink-soft); text-align:center; }
  .cal-day{
    aspect-ratio: 1;
    display:flex; align-items:center; justify-content:center;
    border-radius: 7px;
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.done{ background: var(--accent); border-color: var(--accent); color:#fff; font-weight:600; }
  .cal-day.today{ box-shadow: 0 0 0 1.5px var(--ink) inset; }
  .modal .cal-summary{
    display:flex; justify-content:space-between;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 13px;
  }
  .modal .cal-summary b{ font-family: Georgia, serif; font-size: 16px; }

  .toolbar{
    display:flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 18px;
  }
  .filters{ display:flex; flex-wrap:wrap; gap: 8px; }
  .search-box{
    flex: 1;
    min-width: 180px;
    max-width: 280px;
  }
  .search-box input{
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .search-box input::placeholder{ color: var(--ink-soft); }

  .date-filter{
    display:flex;
    align-items:center;
    gap: 6px;
  }
  .date-filter input[type=date]{
    padding: 7px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .date-filter span{ font-size: 12px; color: var(--ink-soft); }
  .date-filter .clear-dates{
    background:none;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 6px 11px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .date-filter .clear-dates:hover{ border-color: var(--overdue); color: var(--overdue); }
  .chip{
    border: 1px solid var(--line-strong);
    background: var(--card);
    border-radius: 999px;
    padding: 6px 13px;
    font-size: 12.5px;
    cursor: pointer;
    color: var(--ink-soft);
    user-select: none;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chip .dot{ width:7px; height:7px; border-radius:50%; }
  .chip.active{
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }
  .chip.active .dot{ filter: brightness(1.6); }

  button.add-btn{
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.add-btn:hover{ opacity:0.9; }

  .add-form{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 22px;
    display: none;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .add-form.open{ display: grid; }
  .add-form .full{ grid-column: 1 / -1; }
  .add-form label{ font-size: 11.5px; color: var(--ink-soft); display:block; margin-bottom: 4px; }
  .add-form input, .add-form select{
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: #fff;
  }
  .add-form .actions{ grid-column: 1 / -1; display:flex; gap:10px; justify-content:flex-end; }
  .add-form button{
    border: none;
    border-radius: 7px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .add-form .save{ background: var(--accent); color:#fff; }
  .add-form .cancel{ background: transparent; color: var(--ink-soft); border: 1px solid var(--line-strong); }

  .section-title{
    font-size: 13px;
    color: var(--ink-soft);
    text-transform: none;
    margin: 26px 0 10px;
    display:flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .section-title span.count{ font-weight: 600; color: var(--ink); }

  .task-list{ display:flex; flex-direction:column; gap:8px; }
  .task{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .task.overdue{ border-color: var(--overdue); }
  .task input[type=checkbox]{
    width: 19px; height: 19px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink:0;
  }
  .task .course-tag{
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink:0;
  }
  .task .body{ flex: 1; min-width: 0; cursor: pointer; }
  .task .title{ font-size: 14px; line-height:1.3; }
  .task .title:hover{ text-decoration: underline; }
  .task .meta{ font-size: 11.5px; color: var(--ink-soft); margin-top:2px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .task .type-tag{
    font-size: 10px;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    padding: 1px 6px;
    border-radius: 5px;
  }
  .task .countdown{
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    min-width: 92px;
    text-align: right;
  }
  .task .countdown.overdue-text{ color: var(--overdue); }
  .task .countdown.soon-text{ color: var(--soon); }
  .task .countdown.normal-text{ color: var(--ink-soft); }
  .task .del{
    background:none; border:none; color: var(--line-strong); cursor:pointer; font-size: 15px; flex-shrink:0; padding: 2px 4px;
  }
  .task .del:hover{ color: var(--overdue); }

  .completed .task{ opacity: 0.55; }
  .completed .task .title{ text-decoration: line-through; }

  .empty{
    color: var(--ink-soft);
    font-size: 13px;
    padding: 20px 0;
    text-align:center;
  }

  @media (max-width: 760px){
    .kpi-row{ grid-template-columns: repeat(4,1fr); }
  }
  @media (max-width: 480px){
    .kpi-row{ grid-template-columns: repeat(2,1fr); }
  }

  #lockOverlay{
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
  }
  #lockOverlay.hidden{ display:none; }
  .lock-box{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px 26px;
    width: 100%;
    max-width: 320px;
    text-align:center;
  }
  .lock-box h2{ font-size: 18px; margin-bottom: 6px; }
  .lock-box p{ color: var(--ink-soft); font-size: 12.5px; margin: 0 0 16px; }
  .lock-box input{
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .lock-box button{
    width: 100%;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .lock-box .lock-error{ color: var(--overdue); font-size: 12px; margin-top: 8px; display:none; }
</style>
</head>
<body>
<div id="lockOverlay">
  <div class="lock-box">
    <h2>Acceso privado</h2>
    <p>Ingresa la contraseña para ver el checklist.</p>
    <input type="password" id="lockInput" placeholder="Contraseña">
    <button id="lockSubmit">Entrar</button>
    <div class="lock-error" id="lockError">Contraseña incorrecta.</div>
  </div>
</div>
<div class="wrap">
  <header>
    <h1>Checklist académico</h1>
    <p>MISM y MBA · BYU · Otoño 2026</p>
  </header>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Buscar tarea..."></div>
    <div class="date-filter">
      <input type="date" id="dateFrom">
      <span>a</span>
      <input type="date" id="dateTo">
      <button class="clear-dates" id="clearDates">Limpiar</button>
    </div>
    <button class="add-btn" id="toggleAdd">+ Agregar tarea</button>
  </div>

  <div class="add-form" id="addForm">
    <div>
      <label>Clase</label>
      <select id="fCourse"></select>
    </div>
    <div>
      <label>Tipo</label>
      <select id="fType">
        <option value="deliverable">Entrega</option>
        <option value="reading">Lectura / preparación</option>
      </select>
    </div>
    <div class="full">
      <label>Título</label>
      <input type="text" id="fTitle" placeholder="Nombre de la tarea">
    </div>
    <div>
      <label>Fecha</label>
      <input type="date" id="fDate">
    </div>
    <div>
      <label>Hora (opcional)</label>
      <input type="time" id="fTime">
    </div>
    <div class="actions">
      <button class="cancel" id="cancelAdd">Cancelar</button>
      <button class="save" id="saveAdd">Guardar tarea</button>
    </div>
  </div>

  <div class="section-title">Pendientes <span class="count" id="pendingCount">0</span></div>
  <div class="task-list" id="pendingList"></div>

  <div class="section-title">Completadas <span class="count" id="completedCount">0</span></div>
  <div class="task-list completed" id="completedList"></div>
</div>

<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title"><span id="mIcon"></span><span id="mLabel"></span></div>
      <button class="modal-close" id="mClose">&times;</button>
    </div>
    <div class="modal-target" id="mTarget"></div>
    <div class="modal-note" id="mNote"></div>
    <div class="cal-nav">
      <button id="mPrev">&larr;</button>
      <span class="cal-month" id="mMonthLabel"></span>
      <button id="mNext">&rarr;</button>
    </div>
    <div class="cal-grid" id="mDow"></div>
    <div class="cal-grid" id="mGrid" style="margin-top:5px;"></div>
    <div class="cal-summary">
      <div>Este mes: <b id="mMonthCount">0</b></div>
      <div>Esta semana: <b id="mWeekCount">0</b></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="taskModal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-head">
      <div class="modal-title" id="tTitle" style="font-size:16px;"></div>
      <button class="modal-close" id="tClose">&times;</button>
    </div>
    <div class="modal-target" id="tCourse"></div>
    <div class="modal-note" id="tDue" style="margin-bottom:14px;"></div>
    <a id="tLink" href="#" target="_blank" rel="noopener" class="add-form save" style="display:inline-block; text-decoration:none; text-align:center; padding:9px 18px;">Abrir enlace</a>
  </div>
</div>

async function loadHabits(){
  try{
    const raw = localStorage.getItem("checklist-habits");
    if(raw){
      habitLogs = JSON.parse(raw);
      return;
    }
  }catch(e){}
  habitLogs = {};
  GOALS.forEach(g => habitLogs[g.id] = []);
  await saveHabits();
}

async function saveHabits(){
  try{
    localStorage.setItem("checklist-habits", JSON.stringify(habitLogs));
  }catch(e){
    console.error("No se pudo guardar habitos", e);
  }
}

function isoDay(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function startOfWeek(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function countThisWeek(goalId){
  const logs = habitLogs[goalId] || [];
  const now = new Date();
  const mon = startOfWeek(now);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return logs.filter(ds => {
    const d = new Date(ds+"T00:00:00");
    return d >= mon && d <= sun;
  }).length;
}

function countInMonth(goalId, year, month){
  const logs = habitLogs[goalId] || [];
  return logs.filter(ds => {
    const d = new Date(ds+"T00:00:00");
    return d.getFullYear() === year && d.getMonth() === month;
  }).length;
}

async function loadTasks(){
  const fresh = seedTasks();
  try{
    const raw = localStorage.getItem("checklist-tasks");
    if(raw){
      const stored = JSON.parse(raw);
      const storedIds = new Set(stored.map(t=>t.id));
      const merged = stored.concat(fresh.filter(t => !storedIds.has(t.id)));
      tasks = merged;
      await saveTasks();
      return;
    }
  }catch(e){}
  tasks = fresh;
  await saveTasks();
}

async function saveTasks(){
  try{
    localStorage.setItem("checklist-tasks", JSON.stringify(tasks));
  }catch(e){
    console.error("No se pudo guardar", e);
  }
}

function courseInfo(id){
  return COURSES.find(c=>c.id===id) || COURSES[0];
}

function fmtDate(due){
  if(!due) return "Sin fecha";
  const d = new Date(due);
  const opts = { day:"numeric", month:"short" };
  const hasTime = due.length > 10 && due.slice(11) !== "00:00";
  const dateStr = d.toLocaleDateString("es-ES", opts);
  if(hasTime){
    const timeStr = d.toLocaleTimeString("es-ES", {hour:"numeric", minute:"2-digit"});
    return dateStr + " · " + timeStr;
  }
  return dateStr;
}

function countdown(due){
  if(!due) return { text:"Sin fecha", cls:"normal-text" };
  const now = new Date();
  const target = new Date(due);
  const diffMs = target - now;
  const diffH = diffMs / (1000*60*60);
  const diffDays = Math.floor(diffH/24);

  if(diffMs < 0){
    const overdueDays = Math.abs(diffDays);
    if(overdueDays === 0) return { text:"Venció hoy", cls:"overdue-text" };
    return { text:"Vencida hace "+overdueDays+"d", cls:"overdue-text" };
  }
  if(diffH < 24) return { text:"Hoy", cls:"soon-text" };
  if(diffDays === 1) return { text:"Mañana", cls:"soon-text" };
  if(diffDays <= 3) return { text:"En "+diffDays+" días", cls:"soon-text" };
  return { text:"En "+diffDays+" días", cls:"normal-text" };
}

function renderKpis(){
  const total = tasks.length;
  const done = tasks.filter(t=>t.completed).length;
  const kpiRow = document.getElementById("kpiRow");
  kpiRow.innerHTML = "";

  const main = document.createElement("div");
  main.className = "kpi main";
  main.innerHTML = `<div class="num">${done} / ${total}</div><div class="lbl">Tareas completadas</div>`;
  kpiRow.appendChild(main);

  GOALS.forEach(goal => {
    const week = countThisWeek(goal.id);
    const card = document.createElement("div");
    card.className = "kpi goal";
    card.innerHTML = `
      <div class="top">
        <span class="icon">${goal.icon}</span>
        <span class="count">${week}/${goal.weeklyTarget}</span>
      </div>
      <div class="lbl">${goal.label}</div>
    `;
    card.onclick = () => openGoalModal(goal.id);
    kpiRow.appendChild(card);
  });
}

function openGoalModal(goalId){
  modalGoalId = goalId;
  const now = new Date();
  modalYear = now.getFullYear();
  modalMonth = now.getMonth();
  document.getElementById("goalModal").classList.add("open");
  renderModal();
}

function closeGoalModal(){
  document.getElementById("goalModal").classList.remove("open");
  modalGoalId = null;
}

function renderModal(){
  const goal = GOALS.find(g => g.id === modalGoalId);
  if(!goal) return;

  document.getElementById("mIcon").textContent = goal.icon;
  document.getElementById("mLabel").textContent = goal.label;
  document.getElementById("mTarget").textContent = "Meta: " + goal.target;
  document.getElementById("mNote").textContent = goal.note;

  const monthNames = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  document.getElementById("mMonthLabel").textContent = monthNames[modalMonth] + " " + modalYear;

  const dowEl = document.getElementById("mDow");
  dowEl.innerHTML = "";
  ["L","M","M","J","V","S","D"].forEach(d=>{
    const el = document.createElement("div");
    el.className = "cal-dow";
    el.textContent = d;
    dowEl.appendChild(el);
  });

  const grid = document.getElementById("mGrid");
  grid.innerHTML = "";

  const firstOfMonth = new Date(modalYear, modalMonth, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;

  const daysInMonth = new Date(modalYear, modalMonth+1, 0).getDate();
  const todayStr = isoDay(new Date());
  const logs = habitLogs[goal.id] || [];

  for(let i=0;i<startOffset;i++){
    const cell = document.createElement("div");
    cell.className = "cal-day empty";
    grid.appendChild(cell);
  }

  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(modalYear, modalMonth, day);
    const ds = isoDay(d);
    const cell = document.createElement("div");
    cell.className = "cal-day" + (logs.includes(ds) ? " done" : "") + (ds === todayStr ? " today" : "");
    cell.textContent = day;
    cell.onclick = async () => {
      const idx = habitLogs[goal.id].indexOf(ds);
      if(idx >= 0) habitLogs[goal.id].splice(idx,1);
      else habitLogs[goal.id].push(ds);
      await saveHabits();
      renderModal();
      renderKpis();
    };
    grid.appendChild(cell);
  }

  document.getElementById("mMonthCount").textContent = countInMonth(goal.id, modalYear, modalMonth);
  document.getElementById("mWeekCount").textContent = countThisWeek(goal.id) + "/" + goal.weeklyTarget;
}

function openTaskModal(t){
  const info = courseInfo(t.course);
  document.getElementById("tTitle").textContent = t.title;
  document.getElementById("tCourse").textContent = COURSE_NAMES[t.course] || info.label;
  const cd = countdown(t.due);
  document.getElementById("tDue").textContent =
    (t.type === "reading" ? "Lectura / preparación" : "Entrega") + " · " +
    fmtDate(t.due) + (t.due ? " · " + (t.completed ? "Hecha" : cd.text) : "");
  const link = document.getElementById("tLink");
  link.href = taskLink(t);
  link.textContent = t.type === "reading" ? "Abrir lectura" : "Ver en Canvas";
  document.getElementById("taskModal").classList.add("open");
}

function closeTaskModal(){
  document.getElementById("taskModal").classList.remove("open");
}

function setupModal(){
  document.getElementById("tClose").onclick = closeTaskModal;
  document.getElementById("taskModal").onclick = (e) => {
    if(e.target.id === "taskModal") closeTaskModal();
  };
  document.getElementById("mClose").onclick = closeGoalModal;
  document.getElementById("goalModal").onclick = (e) => {
    if(e.target.id === "goalModal") closeGoalModal();
  };
  document.getElementById("mPrev").onclick = () => {
    modalMonth--;
    if(modalMonth < 0){ modalMonth = 11; modalYear--; }
    renderModal();
  };
  document.getElementById("mNext").onclick = () => {
    modalMonth++;
    if(modalMonth > 11){ modalMonth = 0; modalYear++; }
    renderModal();
  };
}

function renderFilters(){
  const el = document.getElementById("filters");
  el.innerHTML = "";
  COURSES.forEach(c=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (activeFilters.has(c.id) ? " active" : "");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = () => {
      if(activeFilters.has(c.id)) activeFilters.delete(c.id);
      else activeFilters.add(c.id);
      renderFilters();
      renderTasks();
    };
    el.appendChild(chip);
  });
}

function taskEl(t){
  const info = courseInfo(t.course);
  const cd = countdown(t.due);
  const isOverdue = t.due && new Date(t.due) < new Date() && !t.completed;

  const row = document.createElement("div");
  row.className = "task" + (isOverdue ? " overdue" : "");

  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = t.completed;
  cb.onchange = async () => {
    t.completed = cb.checked;
    await saveTasks();
    renderKpis();
    renderTasks();
  };

  const tag = document.createElement("span");
  tag.className = "course-tag";
  tag.style.background = info.soft;
  tag.style.color = info.color;
  tag.textContent = info.label;

  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = `
    <div class="title">${t.title}</div>
    <div class="meta">
      <span>${fmtDate(t.due)}</span>
      <span class="type-tag">${t.type === "reading" ? "Lectura / prep" : "Entrega"}</span>
    </div>
  `;
  body.onclick = () => openTaskModal(t);

  const cdEl = document.createElement("div");
  cdEl.className = "countdown " + cd.cls;
  cdEl.textContent = t.completed ? "Hecha" : cd.text;

  const del = document.createElement("button");
  del.className = "del";
  del.innerHTML = "&times;";
  del.title = "Eliminar tarea";
  del.onclick = async () => {
    tasks = tasks.filter(x=>x.id !== t.id);
    await saveTasks();
    renderKpis();
    renderTasks();
  };

  row.appendChild(cb);
  row.appendChild(tag);
  row.appendChild(body);
  row.appendChild(cdEl);
  row.appendChild(del);
  return row;
}

function renderTasks(){
  const q = searchQuery.trim().toLowerCase();
  const visible = tasks.filter(t => {
    if(!activeFilters.has(t.course)) return false;
    if(dateFrom || dateTo){
      if(!t.due) return false;
      const dueDay = t.due.slice(0,10);
      if(dateFrom && dueDay < dateFrom) return false;
      if(dateTo && dueDay > dateTo) return false;
    }
    if(!q) return true;
    const info = courseInfo(t.course);
    const haystack = (t.title + " " + info.label + " " + (COURSE_NAMES[t.course]||"")).toLowerCase();
    return haystack.includes(q);
  });
  const pending = visible.filter(t=>!t.completed).sort((a,b)=>{
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return new Date(a.due) - new Date(b.due);
  });
  const completed = visible.filter(t=>t.completed).sort((a,b)=>{
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return new Date(b.due) - new Date(a.due);
  });

  document.getElementById("pendingCount").textContent = pending.length;
  document.getElementById("completedCount").textContent = completed.length;

  const pList = document.getElementById("pendingList");
  pList.innerHTML = "";
  if(pending.length === 0){
    pList.innerHTML = '<div class="empty">No hay tareas pendientes con este filtro.</div>';
  }else{
    pending.forEach(t => pList.appendChild(taskEl(t)));
  }

  const cList = document.getElementById("completedList");
  cList.innerHTML = "";
  if(completed.length === 0){
    cList.innerHTML = '<div class="empty">Todavía no has completado tareas con este filtro.</div>';
  }else{
    completed.forEach(t => cList.appendChild(taskEl(t)));
  }
}

function setupAddForm(){
  const sel = document.getElementById("fCourse");
  COURSES.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.label;
    sel.appendChild(opt);
  });

  document.getElementById("toggleAdd").onclick = () => {
    document.getElementById("addForm").classList.toggle("open");
  };
  document.getElementById("cancelAdd").onclick = () => {
    document.getElementById("addForm").classList.remove("open");
  };
  document.getElementById("saveAdd").onclick = async () => {
    const course = document.getElementById("fCourse").value;
    const type = document.getElementById("fType").value;
    const title = document.getElementById("fTitle").value.trim();
    const date = document.getElementById("fDate").value;
    const time = document.getElementById("fTime").value;

    if(!title){
      alert("Escribe un título para la tarea.");
      return;
    }
    let due = null;
    if(date){
      due = date + "T" + (time ? time : "23:59");
    }

    tasks.push({
      id: "t-" + Date.now(),
      course, title, type, due,
      completed: false
    });
    await saveTasks();

    document.getElementById("fTitle").value = "";
    document.getElementById("fDate").value = "";
    document.getElementById("fTime").value = "";
    document.getElementById("addForm").classList.remove("open");

    renderKpis();
    renderTasks();
  };
}

async function init(){
  await loadTasks();
  await loadHabits();
  renderKpis();
  renderFilters();
  setupAddForm();
  setupModal();
  document.getElementById("searchInput").oninput = (e) => {
    searchQuery = e.target.value;
    renderTasks();
  };
  document.getElementById("dateFrom").onchange = (e) => {
    dateFrom = e.target.value;
    renderTasks();
  };
  document.getElementById("dateTo").onchange = (e) => {
    dateTo = e.target.value;
    renderTasks();
  };
  document.getElementById("clearDates").onclick = () => {
    dateFrom = "";
    dateTo = "";
    document.getElementById("dateFrom").value = "";
    document.getElementById("dateTo").value = "";
    renderTasks();
  };
  renderTasks();
  setInterval(renderTasks, 60000);
}

const SITE_PASSWORD = "pollo2026";

function unlock(){
  document.getElementById("lockOverlay").classList.add("hidden");
  try{ localStorage.setItem("checklist-auth", "ok"); }catch(e){}
  init();
}

function setupLock(){
  try{
    if(localStorage.getItem("checklist-auth") === "ok"){
      unlock();
      return;
    }
  }catch(e){}

  const input = document.getElementById("lockInput");
  const submit = document.getElementById("lockSubmit");
  const error = document.getElementById("lockError");

  const tryUnlock = () => {
    if(input.value === SITE_PASSWORD){
      unlock();
    }else{
      error.style.display = "block";
      input.value = "";
      input.focus();
    }
  };

  submit.onclick = tryUnlock;
  input.onkeydown = (e) => { if(e.key === "Enter") tryUnlock(); };
  input.focus();
}

setupLock();
</script>
