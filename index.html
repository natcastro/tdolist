<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Checklist académico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var t = null;
  try{ t = localStorage.getItem("checklist-theme"); }catch(e){}
  if(!t){ t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
  :root{
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface-2: #FBFAF7;
    --ink: #1A1D1C;
    --ink-soft: #5B6360;
    --line: #E8E4DB;
    --line-strong: #D3CEC2;
    --accent: #0D7A6B;
    --accent-ink: #FFFFFF;
    --accent-soft: #E1F1ED;
    --overdue: #B23A2B;
    --soon: #9A5F0C;
    --shadow-sm: 0 1px 2px rgba(26,29,28,.05);
    --shadow-md: 0 8px 28px -12px rgba(26,29,28,.18);
    --shadow-lg: 0 24px 60px -20px rgba(26,29,28,.35);

    --c-hrm540: #B3781A; --c-hrm540-soft: #FBF0DD;
    --c-is531: #2E6C8E;  --c-is531-soft: #E4EEF3;
    --c-is550: #3F7D5C;  --c-is550-soft: #E6F1EA;
    --c-is551: #A44B63;  --c-is551-soft: #F5E6EA;
    --c-is560: #A6482F;  --c-is560-soft: #F5E5DF;
    --c-is590r: #1F7A6C; --c-is590r-soft: #E1F1EC;

    --font-sans: "Plus Jakarta Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --font-serif: "Fraunces", Georgia, "Times New Roman", serif;
    --ease: cubic-bezier(.2,.7,.2,1);
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --bg: #0E1312;
    --surface: #161C1B;
    --surface-2: #1B2220;
    --ink: #ECEFEE;
    --ink-soft: #9CA7A3;
    --line: #26302E;
    --line-strong: #364240;
    --accent: #3FC1AD;
    --accent-ink: #06201C;
    --accent-soft: #143029;
    --overdue: #F08C7A;
    --soon: #E6B25A;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 8px 28px -12px rgba(0,0,0,.6);
    --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.8);

    --c-hrm540: #E0A94A; --c-hrm540-soft: #2D2413;
    --c-is531: #6FB0D4;  --c-is531-soft: #14252F;
    --c-is550: #6FBF93;  --c-is550-soft: #15291F;
    --c-is551: #E27F9A;  --c-is551-soft: #301820;
    --c-is560: #E68B6F;  --c-is560-soft: #30190F;
    --c-is590r: #5FCFBD; --c-is590r-soft: #11292A;
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    background: var(--bg);
    color: var(--ink);
    padding: 40px 24px 96px;
    transition: background-color .3s var(--ease), color .3s var(--ease);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: var(--font-serif); font-weight: 500; margin: 0; letter-spacing: -0.01em; }
  button{ font-family: inherit; color: inherit; }
  :focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .wrap{ max-width: 920px; margin: 0 auto; }

  /* Header */
  .top{ display:flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
  .eyebrow{
    margin: 0 0 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .top h1{ font-size: clamp(32px, 6vw, 46px); line-height: 1.05; }
  .icon-btn{
    flex-shrink: 0;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .2s var(--ease), border-color .2s, background-color .3s;
  }
  .icon-btn:hover{ border-color: var(--line-strong); transform: translateY(-1px); }
  .icon-btn:active{ transform: scale(.94); }
  .icon-btn svg{ transition: transform .5s var(--ease); }
  .icon-btn.spin svg{ transform: rotate(180deg); }

  /* Overview */
  .overview{ display: grid; gap: 14px; margin-bottom: 36px; }
  .progress-card{
    display: flex; align-items: center; gap: 28px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 24px 28px;
    box-shadow: var(--shadow-md);
    transition: background-color .3s var(--ease), border-color .3s;
  }
  .ring{ position: relative; width: 132px; height: 132px; flex-shrink: 0; }
  .ring svg{ width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg{ fill: none; stroke: var(--line); stroke-width: 9; }
  .ring-fg{
    fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round;
    stroke-dasharray: 326.73; stroke-dashoffset: 326.73;
    transition: stroke-dashoffset 1.1s var(--ease), opacity .3s;
  }
  .ring.empty .ring-fg{ opacity: 0; }
  .ring-label{
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--font-serif); font-size: 28px; font-weight: 500;
  }
  .ring.bump{ animation: bump .45s var(--ease); }
  .progress-meta{ flex: 1; min-width: 0; }
  .big{ font-family: var(--font-serif); font-size: 40px; line-height: 1; font-weight: 500; }
  .big .of{ color: var(--ink-soft); font-size: 24px; }
  .progress-meta .lbl{ color: var(--ink-soft); font-size: 13px; margin: 6px 0 18px; }
  .course-bars{ display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 22px; }
  .cbar{ font-size: 12px; }
  .cbar-head{ display: flex; justify-content: space-between; margin-bottom: 5px; color: var(--ink-soft); }
  .cbar-head b{ color: var(--ink); font-weight: 600; }
  .cbar-track{ height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .cbar-fill{ height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .9s var(--ease); }

  .habits{ display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .habit{
    text-align: left;
    display: grid; grid-template-columns: auto 1fr; grid-template-areas: "ic count" "name name" "bar bar";
    align-items: center; gap: 4px 8px;
    padding: 14px 14px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .25s var(--ease), border-color .2s, box-shadow .25s var(--ease), background-color .3s;
  }
  .habit:hover{ transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-md); }
  .habit:active{ transform: scale(.98); }
  .habit-ic{ grid-area: ic; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
  .habit-count{ grid-area: count; justify-self: end; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .habit-count b{ color: var(--ink); font-size: 15px; font-weight: 700; }
  .habit-name{ grid-area: name; font-size: 12.5px; color: var(--ink-soft); margin-top: 6px; }
  .habit-bar{ grid-area: bar; height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .habit-bar i{ display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .7s var(--ease); }
  .habit.met .habit-ic{ background: var(--accent); color: var(--accent-ink); }

  /* Toolbar */
  .toolbar{ display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .toolbar-row{ display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .filters{ display: flex; flex-wrap: wrap; gap: 8px; }
  .chip{
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 14px; min-height: 36px;
    font-size: 13px; font-weight: 500;
    border: 1px solid var(--ink);
    background: var(--ink); color: var(--bg);
    border-radius: 999px; cursor: pointer; user-select: none;
    transition: background-color .2s, color .2s, border-color .2s, transform .15s var(--ease);
  }
  .chip:active{ transform: scale(.96); }
  .chip .dot{ width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip:not(.active){ background: transparent; color: var(--ink-soft); border: 1px dashed var(--line-strong); }
  .chip:not(.active) .dot{ opacity: .45; }
  .chip:not(.active):hover{ color: var(--ink); border-color: var(--ink-soft); }

  .search-box{ position: relative; flex: 1 1 200px; min-width: 180px; }
  .search-box svg{ position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
  .field, .search-box input, .date-filter input[type=date]{
    height: 44px; padding: 0 14px;
    font-family: inherit; font-size: 14px; color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    transition: border-color .2s, box-shadow .2s, background-color .3s;
  }
  .search-box input{ width: 100%; padding-left: 42px; }
  .search-box input::placeholder{ color: var(--ink-soft); }
  .search-box input:focus, .date-filter input:focus{ outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .date-filter{ display: flex; align-items: center; gap: 8px; }
  .date-filter span{ font-size: 13px; color: var(--ink-soft); }
  .date-filter input[type=date]{ padding: 0 10px; }
  .ghost-btn{
    height: 44px; padding: 0 14px; font-size: 13px;
    background: transparent; border: 1px solid var(--line-strong); border-radius: 12px;
    color: var(--ink-soft); cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  .ghost-btn:hover{ border-color: var(--overdue); color: var(--overdue); }
  .btn-primary{
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; padding: 0 18px;
    font-size: 14px; font-weight: 600; text-decoration: none;
    background: var(--ink); color: var(--bg);
    border: none; border-radius: 12px; cursor: pointer;
    transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .2s;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-primary:active{ transform: scale(.97); }
  .add-btn{ margin-left: auto; }

  /* Add form */
  .add-form{
    display: none; grid-template-columns: 1fr 1fr; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    padding: 22px; margin-bottom: 26px; box-shadow: var(--shadow-md);
  }
  .add-form.open{ display: grid; animation: rise .35s var(--ease); }
  .add-form .full{ grid-column: 1 / -1; }
  .add-form label{ display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .add-form input, .add-form select{ width: 100%; height: 44px; padding: 0 12px; font-family: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px; }
  .add-form input:focus, .add-form select:focus{ outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .add-form .actions{ grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; }
  .add-form button{ height: 44px; padding: 0 18px; font-size: 14px; border-radius: 12px; cursor: pointer; border: none; transition: transform .2s var(--ease), opacity .2s; }
  .add-form button:active{ transform: scale(.97); }
  .add-form .save{ background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .add-form .cancel{ background: transparent; color: var(--ink-soft); border: 1px solid var(--line-strong); }

  /* Lists */
  .section-title{
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 34px 0 12px;
    font-family: var(--font-serif); font-size: 22px; font-weight: 500;
  }
  .section-title .count{ font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); padding: 2px 10px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .group-title{
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 8px;
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
  }
  .group-title::after{ content: ""; flex: 1; height: 1px; background: var(--line); }
  .group-title.overdue{ color: var(--overdue); }
  .group-title .n{ font-weight: 600; letter-spacing: 0; opacity: .8; }
  .task-list{ display: flex; flex-direction: column; gap: 8px; }

  .task{
    --c: var(--accent); --cs: var(--accent-soft);
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px 12px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s, opacity .3s, background-color .3s;
  }
  .task::before{ content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
  .task:hover{ transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
  .task.enter{ animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 30ms); }
  .task.completing{ opacity: .45; transform: translateX(6px); }
  .task.removing{ opacity: 0; transform: scale(.97); }

  .check{ position: relative; display: grid; place-items: center; width: 44px; height: 44px; margin: -10px -8px -10px -10px; cursor: pointer; flex-shrink: 0; }
  .check input{ position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .check .box{
    width: 22px; height: 22px; display: grid; place-items: center;
    border: 1.5px solid var(--line-strong); border-radius: 7px;
    background: var(--surface); color: var(--accent-ink);
    transition: background-color .2s, border-color .2s, transform .25s var(--ease);
  }
  .check .box svg{ width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .3s var(--ease) .05s; }
  .check:hover .box{ border-color: var(--accent); }
  .check input:checked + .box{ background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
  .check input:checked + .box svg{ stroke-dashoffset: 0; }
  .check input:focus-visible + .box{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .course-tag{ display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; min-width: 82px; padding: 3px 9px; font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--cs); color: var(--ink); border-radius: 7px; }
  .course-tag::before{ content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .task .body{ flex: 1; min-width: 0; cursor: pointer; border-radius: 8px; }
  .task .title{ position: relative; display: inline; font-size: 14.5px; line-height: 1.35; font-weight: 500; background-image: linear-gradient(currentColor, currentColor); background-repeat: no-repeat; background-position: 0 58%; background-size: 0% 1.5px; transition: background-size .35s var(--ease), color .3s; }
  .task .body:hover .title{ color: var(--accent); }
  .task .meta{ display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 3px; font-size: 12px; color: var(--ink-soft); }
  .type-tag{ font-size: 10.5px; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 6px; }
  .countdown{ flex-shrink: 0; min-width: 96px; text-align: right; font-size: 12.5px; font-weight: 600; }
  .countdown.overdue-text{ color: var(--overdue); }
  .countdown.soon-text{ color: var(--soon); }
  .countdown.normal-text{ color: var(--ink-soft); }
  .del{ flex-shrink: 0; width: 36px; height: 36px; display: grid; place-items: center; margin: -6px -6px -6px 0; background: none; border: none; border-radius: 10px; color: var(--ink-soft); opacity: .45; cursor: pointer; transition: opacity .2s, color .2s, background-color .2s; }
  .task:hover .del, .del:focus-visible{ opacity: 1; }
  .del:hover{ color: var(--overdue); background: color-mix(in srgb, var(--overdue) 12%, transparent); }
  .task.overdue{ border-color: color-mix(in srgb, var(--overdue) 45%, var(--line)); }

  .completed .task{ opacity: .6; box-shadow: none; }
  .completed .task .title{ background-size: 100% 1.5px; color: var(--ink-soft); }
  .completed .task::before{ opacity: .5; }

  .empty{ padding: 34px 16px; text-align: center; font-size: 14px; color: var(--ink-soft); border: 1px dashed var(--line-strong); border-radius: 14px; }

  /* Modals */
  .modal-overlay{ display: none; position: fixed; inset: 0; z-index: 50; padding: 20px; align-items: center; justify-content: center; background: rgba(10,14,13,.5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .modal-overlay.open{ display: flex; animation: fade .25s ease both; }
  .modal{ width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg); }
  .modal-overlay.open .modal{ animation: pop .35s var(--ease) both; }
  .modal-head{ display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .modal-title{ display: flex; align-items: center; gap: 10px; font-family: var(--font-serif); font-size: 20px; line-height: 1.25; }
  .modal-title .ic{ display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
  .modal-close{ flex-shrink: 0; width: 36px; height: 36px; display: grid; place-items: center; margin: -6px -8px 0 0; background: none; border: none; border-radius: 10px; color: var(--ink-soft); font-size: 22px; line-height: 1; cursor: pointer; transition: background-color .2s, color .2s; }
  .modal-close:hover{ background: var(--surface-2); color: var(--ink); }
  .modal-target{ font-size: 13px; color: var(--ink-soft); margin: 2px 0 4px; }
  .modal-note{ font-size: 13px; color: var(--ink-soft); margin-bottom: 18px; line-height: 1.5; }
  .cal-nav{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-nav button{ width: 36px; height: 36px; background: none; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--ink-soft); cursor: pointer; font-size: 15px; transition: border-color .2s, color .2s; }
  .cal-nav button:hover{ border-color: var(--ink-soft); color: var(--ink); }
  .cal-month{ font-size: 14px; font-weight: 600; text-transform: capitalize; }
  .cal-grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-dow{ font-size: 10.5px; font-weight: 600; text-align: center; color: var(--ink-soft); }
  .cal-day{ aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: background-color .2s, border-color .2s, transform .15s var(--ease); }
  .cal-day:hover{ border-color: var(--accent); }
  .cal-day:active{ transform: scale(.92); }
  .cal-day.empty{ visibility: hidden; cursor: default; }
  .cal-day.done{ background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .cal-day.today{ box-shadow: 0 0 0 1.5px var(--ink) inset; }
  .cal-summary{ display: flex; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .cal-summary b{ font-family: var(--font-serif); font-size: 18px; color: var(--ink); }

  /* Lock screen */
  #lockOverlay{ position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); }
  #lockOverlay.hidden{ display: none; }
  .lock-box{ width: 100%; max-width: 340px; text-align: center; padding: 34px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow-lg); animation: pop .5s var(--ease) both; }
  .lock-ic{ display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); }
  .lock-box h2{ font-size: 24px; margin-bottom: 6px; }
  .lock-box p{ margin: 0 0 20px; font-size: 13.5px; color: var(--ink-soft); }

function isoDay(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function startOfWeek(d){
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  const monday = new Date(d);
  monday.setDate(d.getDate() + diff);
  monday.setHours(0,0,0,0);
  return monday;
}

function countThisWeek(goalId){
  const logs = habitLogs[goalId] || [];
  const now = new Date();
  const mon = startOfWeek(now);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return logs.filter(ds => {
    const d = new Date(ds+"T00:00:00");
    return d >= mon && d <= sun;
  }).length;
}

function countInMonth(goalId, year, month){
  const logs = habitLogs[goalId] || [];
  return logs.filter(ds => {
    const d = new Date(ds+"T00:00:00");
    return d.getFullYear() === year && d.getMonth() === month;
  }).length;
}

function fmtDate(due){
  if(!due) return "Sin fecha";
  const d = new Date(due);
  const opts = { day:"numeric", month:"short" };
  const hasTime = due.length > 10 && due.slice(11) !== "00:00";
  const dateStr = d.toLocaleDateString("es-ES", opts);
  if(hasTime){
    const timeStr = d.toLocaleTimeString("es-ES", {hour:"numeric", minute:"2-digit"});
    return dateStr + " · " + timeStr;
  }
  return dateStr;
}

function countdown(due){
  if(!due) return { text:"Sin fecha", cls:"normal-text" };
  const now = new Date();
  const target = new Date(due);
  const diffMs = target - now;
  const diffH = diffMs / (1000*60*60);
  const diffDays = Math.floor(diffH/24);

  if(diffMs < 0){
    const overdueDays = Math.abs(diffDays);
    if(overdueDays === 0) return { text:"Venció hoy", cls:"overdue-text" };
    return { text:"Vencida hace "+overdueDays+"d", cls:"overdue-text" };
  }
  if(diffH < 24) return { text:"Hoy", cls:"soon-text" };
  if(diffDays === 1) return { text:"Mañana", cls:"soon-text" };
  if(diffDays <= 3) return { text:"En "+diffDays+" días", cls:"soon-text" };
  return { text:"En "+diffDays+" días", cls:"normal-text" };
}

const REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const RING_C = 2 * Math.PI * 52;
let lastDone = null;

function animateNumber(el, to){
  const from = Number(el.dataset.v || 0);
  el.dataset.v = to;
  if(REDUCED_MOTION || from === to){ el.textContent = to; return; }
  const t0 = performance.now();
  const dur = 600;
  const step = (now) => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function updateProgress(){
  const total = tasks.length;
  const done = tasks.filter(t => t.completed).length;
  const pct = total ? Math.round(done / total * 100) : 0;

  animateNumber(document.getElementById("doneNum"), done);
  document.getElementById("totalNum").textContent = total;
  document.getElementById("ringPct").textContent = pct + "%";
  document.getElementById("ring").classList.toggle("empty", done === 0);
  document.getElementById("ringFg").style.strokeDashoffset = RING_C * (1 - (total ? done / total : 0));

  if(lastDone !== null && done > lastDone){
    const ring = document.getElementById("ring");
    ring.classList.remove("bump");
    void ring.offsetWidth;
    ring.classList.add("bump");
  }
  lastDone = done;

  const bars = document.getElementById("courseBars");
  if(!bars.children.length){
    COURSES.forEach(c => {
      const el = document.createElement("div");
      el.className = "cbar";

  if(deletedIds.indexOf(removed.id) < 0) deletedIds.push(removed.id);

  renderKpis();

  });

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function dayGroup(t){
  if(!t.due) return { key:"none", label:"Sin fecha" };
  const now = new Date();
  const due = new Date(t.due);
  if(due < now) return { key:"overdue", label:"Vencidas" };
  const day = t.due.slice(0,10);
  const today = isoDay(now);
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  if(day === today) return { key:"today", label:"Hoy" };
  if(day === isoDay(tomorrow)) return { key:"tomorrow", label:"Mañana" };
  const diff = Math.round((new Date(day + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
  if(diff <= 7) return { key:"week", label:"Esta semana" };
  return { key: day.slice(0,7), label: capitalize(due.toLocaleDateString("es-ES", { month:"long", year:"numeric" })) };
}

function renderTasks(animate){
  const q = searchQuery.trim().toLowerCase();
  const visible = tasks.filter(t => {
    if(!activeFilters.has(t.course)) return false;
    if(dateFrom || dateTo){
      if(!t.due) return false;
      const dueDay = t.due.slice(0,10);
      if(dateFrom && dueDay < dateFrom) return false;
      if(dateTo && dueDay > dateTo) return false;
    }
    if(!q) return true;
    const info = courseInfo(t.course);
    const haystack = (t.title + " " + info.label + " " + (COURSE_NAMES[t.course]||"")).toLowerCase();
    return haystack.includes(q);
  });
  const pending = visible.filter(t=>!t.completed).sort((a,b)=>{
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return new Date(a.due) - new Date(b.due);
  });
  const completed = visible.filter(t=>t.completed).sort((a,b)=>{
    if(!a.due && !b.due) return 0;
    if(!a.due) return 1;
    if(!b.due) return -1;
    return new Date(b.due) - new Date(a.due);
  });

  document.getElementById("pendingCount").textContent = pending.length;
  document.getElementById("completedCount").textContent = completed.length;

  const pList = document.getElementById("pendingList");
  pList.innerHTML = "";
  if(pending.length === 0){
    pList.innerHTML = '<div class="empty">No hay tareas pendientes con este filtro.</div>';
  }else{
    let idx = 0;
    let current = null;
    let listEl = null;
    pending.forEach(t => {
      const g = dayGroup(t);
      if(!current || current.key !== g.key){
        current = { key: g.key, count: 0 };
        const head = document.createElement("div");
        head.className = "group-title" + (g.key === "overdue" ? " overdue" : "");
        head.innerHTML = '<span>' + g.label + '</span><span class="n"></span>';
        pList.appendChild(head);
        listEl = document.createElement("div");
        listEl.className = "task-list";
        pList.appendChild(listEl);
        current.head = head;
      }
      current.count++;
      current.head.querySelector(".n").textContent = current.count;
      listEl.appendChild(taskEl(t, idx++, animate));
    });
  }

  const cList = document.getElementById("completedList");
  cList.innerHTML = "";
  if(completed.length === 0){
    cList.innerHTML = '<div class="empty">Todavía no has completado tareas con este filtro.</div>';
  }else{
    completed.forEach((t, i) => cList.appendChild(taskEl(t, i, false)));
  }
}

const AI_FUNCTION = "assistant-etsoy-en-esta-par"; // nombre (slug) de la Edge Function en Supabase
let aiHistory = [];
let aiBusy = false;
let aiRecog = null;
let aiListening = false;
let aiMicText = "";

const AI_STOPWORDS = new Set(["para","tengo","hacer","esta","este","ahora","tarea","clase","entrega","manana","semana","como","pero","porque","quiero","agrega","agregar","cambia","cambiar","termine","tambien","entonces","sobre","desde","hasta","todas","todos","algo"]);

function aiNorm(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }

// El plan gratis tiene un tope de tokens por minuto: solo mandamos las tareas relevantes
// (próximas, recientes, sin fecha, o que mencionan palabras de la conversación).
function aiRelevantTasks(text){
  const now = new Date();
  const lo = new Date(now); lo.setDate(lo.getDate() - 14);
  const hi = new Date(now); hi.setDate(hi.getDate() + 30);
  const said = aiNorm(text + " " + aiHistory.filter(h => h.role === "user").map(h => h.text).join(" "));
  const words = said.split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !AI_STOPWORDS.has(w));
  return tasks.filter(t => {
    if(t.completed) return false;
    if(!t.due) return true;
    const d = new Date(t.due);
    if(d >= lo && d <= hi) return true;
    const title = aiNorm(t.title);
    return words.some(w => title.includes(w));
  }).sort((a, b) => (a.due || "9").localeCompare(b.due || "9")).slice(0, 90);
}

function aiContext(text){
  const now = new Date();
  const days = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
  return {
    today: isoDay(now),
    time: now.toTimeString().slice(0,5),
    weekday: days[now.getDay()],
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    tasks: aiRelevantTasks(text).map(t => ({ id:t.id, course:t.course, title:t.title, due:t.due }))
  };
}

function aiValidDate(d){
  if(typeof d !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return null;
  return isNaN(new Date(d + "T00:00:00")) ? null : d;
}
function aiValidTime(t){
  return (typeof t === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(t)) ? t : null;
}

// Convierte la respuesta del modelo en cambios verificados contra la lista real.
function aiNormalize(changes){
  const out = [];
  changes.forEach(c => {
    const date = aiValidDate(c.date);
    const time = aiValidTime(c.time);
    const course = COURSES.some(x => x.id === c.course) ? c.course : null;
    const type = c.type === "reading" ? "reading" : (c.type === "deliverable" ? "deliverable" : null);
    if(c.action === "add"){
      const title = (c.title || "").trim();
      if(!title || !course) return;
      out.push({ action:"add", on:true, course, title, type: type || "deliverable", due: date ? date + "T" + (time || "23:59") : null });
      return;
    }
    const target = tasks.find(t => t.id === c.taskId);
    if(!target) return;
    if(c.action === "update"){
      const patch = {};
      if(c.title && c.title.trim() && c.title.trim() !== target.title) patch.title = c.title.trim();
      if(course && course !== target.course) patch.course = course;
      if(type && type !== target.type) patch.type = type;
      if(date || time){
        const base = date || (target.due ? target.due.slice(0,10) : null);
        if(base){
          const tm = time || (target.due && target.due.length > 10 ? target.due.slice(11,16) : "23:59");
          const due = base + "T" + tm;
          if(due !== target.due) patch.due = due;
        }
      }
      if(Object.keys(patch).length) out.push({ action:"update", on:true, target, patch });
    }else if(c.action === "complete" || c.action === "delete"){
      out.push({ action:c.action, on:true, target });
    }
  });
  return out;
}

function aiRow(item){
  const labels = { add:"Agregar", update:"Cambiar", complete:"Completar", delete:"Eliminar" };
  const row = document.createElement("label");
  row.className = "p-row";
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = true;
  const main = document.createElement("div");
  main.className = "p-main";
  const badge = document.createElement("span");
  badge.className = "badge " + item.action;
  badge.textContent = labels[item.action];
  const title = document.createElement("div");
  title.className = "p-title";
  const sub = document.createElement("div");
  sub.className = "p-sub";

  if(item.action === "add"){
    title.textContent = item.title;
    sub.textContent = courseInfo(item.course).label + " · " + fmtDate(item.due) + " · " + (item.type === "reading" ? "Lectura / prep" : "Entrega");
  }else{
    const t = item.target, p = item.patch || {};
    title.textContent = p.title || t.title;
    const lines = [courseInfo(p.course || t.course).label];
    if(item.action === "update"){
      if(p.title){ const o = document.createElement("span"); o.className = "p-old"; o.textContent = t.title; sub.appendChild(o); sub.appendChild(document.createElement("br")); }
      if("due" in p) lines.push("Fecha: " + fmtDate(t.due) + " → " + fmtDate(p.due));
      if(p.course) lines.push("Clase: " + courseInfo(t.course).label + " → " + courseInfo(p.course).label);
      if(p.type) lines.push("Tipo: " + (p.type === "reading" ? "Lectura / prep" : "Entrega"));
    }else{
      lines.push(fmtDate(t.due));
    }
    sub.appendChild(document.createTextNode(lines.join(" · ")));
  }
  main.appendChild(badge);
  main.appendChild(title);
  main.appendChild(sub);
  row.appendChild(cb);
  row.appendChild(main);
  cb.onchange = () => { item.on = cb.checked; row.dispatchEvent(new CustomEvent("aichange", { bubbles:true })); };
  return row;
}

function aiRenderProposal(items){
  const card = document.createElement("div");
  card.className = "proposal";
  const head = document.createElement("div");
  head.className = "p-head";
  head.textContent = "Propuesta · nada se aplica hasta que toques «Aplicar»";
  card.appendChild(head);
  items.forEach(it => card.appendChild(aiRow(it)));

  const actions = document.createElement("div");
  actions.className = "p-actions";
  const apply = document.createElement("button");
  apply.type = "button";
  apply.className = "btn-primary";
  const discard = document.createElement("button");
  discard.type = "button";
  discard.className = "ghost-btn";
  discard.textContent = "Descartar";
  const refresh = () => {
    const n = items.filter(i => i.on).length;
    apply.textContent = "Aplicar " + n + (n === 1 ? " cambio" : " cambios");
    apply.disabled = n === 0;
  };
  card.addEventListener("aichange", refresh);
  refresh();
  apply.onclick = () => aiApply(items, card);
  discard.onclick = () => { card.remove(); aiMsg("ai", "Listo, lo descarté. Dime qué corregir o qué agregar."); };
  actions.appendChild(apply);
  actions.appendChild(discard);
  card.appendChild(actions);
  aiThread().appendChild(card);
  aiScroll();
}

async function aiApply(items, card){
  const snap = { tasks: JSON.parse(JSON.stringify(tasks)), deleted: deletedIds.slice() };
  let n = 0;
  items.filter(i => i.on).forEach(i => {
    if(i.action === "add"){
      tasks.push({ id: "t-" + Date.now() + "-" + n, course:i.course, title:i.title, type:i.type, due:i.due, link:null, completed:false });
    }else if(i.action === "update"){
      Object.assign(i.target, i.patch);
    }else if(i.action === "complete"){
      i.target.completed = true;
    }else if(i.action === "delete"){
      tasks = tasks.filter(t => t !== i.target);
      if(deletedIds.indexOf(i.target.id) < 0) deletedIds.push(i.target.id);
    }
    n++;
  });
  await saveTasks();
  renderKpis();
  renderTasks(true);
  const done = document.createElement("div");
  done.className = "p-done";
  done.innerHTML = icon("check", 16) + " " + n + (n === 1 ? " cambio aplicado" : " cambios aplicados");
  card.replaceWith(done);
  aiScroll();
  showToast(n + (n === 1 ? " cambio aplicado" : " cambios aplicados"), "Deshacer", async () => {
    tasks = snap.tasks;
    deletedIds = snap.deleted;
    await saveTasks();
    renderKpis();
    renderTasks(true);
  });
}

async function aiErrorText(e){
  let status = e && e.context && e.context.status;
  let detail = "";
  try{
    if(e && e.context && typeof e.context.json === "function"){
      const j = await e.context.json();
      detail = j && j.error ? j.error : "";
    }
  }catch(_){}
  console.error("Asistente:", e);
  if(detail) return detail;
  if(status === 404) return "El asistente todavía no está activado en Supabase (falta publicar la función \"assistant\").";
  if(status === 401) return "Tu sesión expiró. Recarga la página e inicia sesión de nuevo.";
  return "No pude hablar con el asistente. Revisa tu conexión e inténtalo de nuevo.";
}

async function aiSubmit(raw){
  const text = (raw || "").trim();
  if(!text || aiBusy || !sb) return;
  aiStopListening();
  aiBusy = true;
  const input = document.getElementById("aiText");
  input.value = "";
  input.style.height = "";
  aiUpdateSend();
  aiMsg("user", text);
  const wait = document.createElement("div");
  wait.className = "msg ai";
  wait.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  aiThread().appendChild(wait);
  aiScroll();
  try{
    const { data, error } = await sb.functions.invoke(AI_FUNCTION, {
      body: { message: text, history: aiHistory.slice(-8), context: aiContext(text) }
    });
    if(error) throw error;
    if(!data || data.error) throw new Error((data && data.error) || "Respuesta vacía");
    wait.remove();
    aiHistory.push({ role:"user", text }, { role:"model", text: data.reply || "" });
    if(data.reply) aiMsg("ai", data.reply);
    const items = aiNormalize(Array.isArray(data.changes) ? data.changes : []);
    if(items.length) aiRenderProposal(items);
    else if(!data.reply) aiMsg("ai", "No entendí ningún cambio. ¿Me lo puedes decir de otra forma?");
  }catch(e){
    wait.remove();
    aiMsg("ai err", await aiErrorText(e));
  }
  aiBusy = false;
  aiUpdateSend();
}

function aiStopListening(){
  if(aiRecog && aiListening){ try{ aiRecog.stop(); }catch(_){} }
}

function setupAssistant(){
  const fab = document.getElementById("aiFab");
  fab.innerHTML = icon("sparkles", 20) + "<span>Asistente</span>";
  fab.hidden = false;
  fab.onclick = openAssistant;
  document.getElementById("aiTitleIc").innerHTML = icon("sparkles", 18);
  document.getElementById("aiClose").onclick = closeAssistant;
  document.getElementById("aiOverlay").onclick = (e) => { if(e.target.id === "aiOverlay") closeAssistant(); };
  document.addEventListener("keydown", (e) => { if(e.key === "Escape") closeAssistant(); });

  const input = document.getElementById("aiText");
  const send = document.getElementById("aiSend");
  send.innerHTML = icon("send", 20);
  send.onclick = () => aiSubmit(input.value);
  input.oninput = () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
    aiUpdateSend();
  };
  input.onkeydown = (e) => {
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); aiSubmit(input.value); }
  };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("aiMic");
  if(!SR) return;
  mic.hidden = false;
  mic.innerHTML = icon("mic", 20);
  mic.onclick = () => {
    if(aiListening){ aiStopListening(); return; }
    aiMicText = "";
    aiRecog = new SR();
    aiRecog.lang = (navigator.language || "").toLowerCase().startsWith("es") ? navigator.language : "es-US";
    aiRecog.interimResults = true;
    aiRecog.continuous = false;
    aiRecog.onstart = () => { aiListening = true; mic.classList.add("listening"); mic.setAttribute("aria-label", "Detener"); };
    aiRecog.onresult = (ev) => {
      let txt = "";
      for(let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      aiMicText = txt;
      input.value = txt;
      input.dispatchEvent(new Event("input"));
    };
    aiRecog.onerror = (ev) => {
      if(ev.error === "not-allowed" || ev.error === "service-not-allowed"){
        aiMsg("ai err", "No tengo permiso para usar el micrófono. Actívalo en los ajustes del navegador, o escribe tu mensaje.");
      }
    };
    aiRecog.onend = () => {
      aiListening = false;
      mic.classList.remove("listening");
      mic.setAttribute("aria-label", "Hablar");
      if(aiMicText.trim()) aiSubmit(aiMicText);
    };
    try{ aiRecog.start(); }catch(_){}
  };
}

function setupTheme(){
  const btn = document.getElementById("themeToggle");
  const paint = () => {
    const dark = document.documentElement.dataset.theme === "dark";
    btn.innerHTML = icon(dark ? "sun" : "moon", 20);
    btn.setAttribute("aria-label", dark ? "Cambiar a tema claro" : "Cambiar a tema oscuro");
    const tc = document.getElementById("themeColor");
    if(tc) tc.setAttribute("content", dark ? "#0E1312" : "#F7F5F0");
  };
  paint();
  btn.onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem("checklist-theme", next); }catch(e){}
    btn.classList.remove("spin");
    void btn.offsetWidth;
    btn.classList.add("spin");
    paint();
  };
}

async function init(){
  if(CLOUD_ENABLED){
    try{ await cloudPull(); setSync("ok"); }catch(e){ console.error(e); setSync("error"); }
  }
  await loadTasks();
  await loadHabits();
  renderKpis();
  renderFilters();
  setupAddForm();
  setupModal();
  document.getElementById("searchInput").oninput = (e) => {
    searchQuery = e.target.value;
    renderTasks();
  };
  document.getElementById("dateFrom").onchange = (e) => {
    dateFrom = e.target.value;
    renderTasks(true);
  };
  document.getElementById("dateTo").onchange = (e) => {
    dateTo = e.target.value;
    renderTasks(true);
  };
  document.getElementById("clearDates").onclick = () => {
    dateFrom = "";
    dateTo = "";
    document.getElementById("dateFrom").value = "";
    document.getElementById("dateTo").value = "";
    renderTasks(true);
  };
  renderTasks(true);
  setInterval(() => renderTasks(), 60000);
  if(CLOUD_ENABLED) setupAssistant();

  if(CLOUD_ENABLED){
    document.addEventListener("visibilitychange", async () => {
      if(document.hidden || cloudTimer) return;
      try{
        await cloudPull();
        setSync("ok");
        await loadTasks(true);
        await loadHabits(true);
        renderKpis();
        renderTasks();
      }catch(e){ setSync("error"); }
    });
  }
}

const SITE_PASSWORD = "pollo2026";

function unlock(){
  document.getElementById("lockOverlay").classList.add("hidden");
  if(!CLOUD_ENABLED){
    try{ localStorage.setItem("checklist-auth", "ok"); }catch(e){}
  }
  init();
}

async function setupLock(){
  document.getElementById("lockIc").innerHTML = icon("lock", 24);
  document.getElementById("searchIc").innerHTML = icon("search", 16);
  document.getElementById("toggleAdd").innerHTML = icon("plus", 16) + " Agregar tarea";

  const input = document.getElementById("lockInput");
  const submit = document.getElementById("lockSubmit");
  const error = document.getElementById("lockError");
  const box = document.getElementById("lockBox");

  if(CLOUD_ENABLED){
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    try{
      const { data } = await sb.auth.getSession();
      if(data && data.session){
        cloudUserId = data.session.user.id;
        unlock();
        return;
      }
    }catch(e){}
  }else{
    try{
      if(localStorage.getItem("checklist-auth") === "ok"){
        unlock();
        return;
      }
    }catch(e){}
  }

  const fail = (msg) => {
    error.textContent = msg;
    error.style.display = "block";
    input.value = "";
    input.focus();
    box.classList.remove("shake");
    void box.offsetWidth;
    box.classList.add("shake");
  };

  const tryUnlock = async () => {
    if(CLOUD_ENABLED){
      submit.disabled = true;
      try{
        const { data, error: err } = await sb.auth.signInWithPassword({ email: SUPABASE_EMAIL, password: input.value });
        if(err){
          fail(/invalid/i.test(err.message) ? "Contraseña incorrecta." : "No se pudo conectar. Intenta de nuevo.");
        }else{
          cloudUserId = data.user.id;
          unlock();
        }
      }catch(e){
        fail("No se pudo conectar. Intenta de nuevo.");
      }
      submit.disabled = false;
    }else if(input.value === SITE_PASSWORD){
      unlock();
    }else{
      fail("Contraseña incorrecta.");
    }
  };

  submit.onclick = tryUnlock;
  input.onkeydown = (e) => { if(e.key === "Enter") tryUnlock(); };
  input.focus();
}

setupTheme();
setupLock();
